[project]
name = "video-studio"
version = "2.0.0"
description = "AI 视频生产多 Agent 系统：人类主导创意，Agent 管生产（V2.0 Release：25 Agent + 事实核查 + Claim 级人工审核）"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.28",
]

[project.scripts]
video-studio = "video_studio.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
